<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CastleIQ — Black Friday 2026</title>
  <meta name="description" content="Black Friday 2026. 40% off CastleIQ services. Make your pricing work harder.">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #071422; color: #F7F4EC; font-family: "Segoe UI", system-ui, sans-serif; }
    .wrap { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 20px 48px; gap: 18px; }
    .mark { margin: 0; letter-spacing: .28em; font-size: .82rem; font-weight: 700; color: #C9A84C; }
    h1 { margin: 0; font-size: clamp(1.6rem, 4vw, 2.6rem); font-weight: 650; letter-spacing: -.03em; text-align: center; }
    .offer { margin: 0; color: #C9A84C; font-weight: 700; letter-spacing: .08em; font-size: .95rem; text-align: center; }
    video { width: min(1100px, 100%); border-radius: 16px; background: #000; box-shadow: 0 30px 80px rgba(0,0,0,.45); }
    p { margin: 0; color: #d9d3c5; text-align: center; max-width: 36rem; line-height: 1.5; }
    a.cta { display: inline-block; margin-top: 6px; background: #C9A84C; color: #0B1F3A; text-decoration: none; font-weight: 700; letter-spacing: .04em; padding: 14px 22px; border-radius: 999px; }
    a.cta:hover { filter: brightness(1.06); }
  </style>
</head>
<body>
  <main class="wrap">
    <p class="mark">CASTLEIQ</p>
    <h1>Black Friday 2026</h1>
    <p class="offer">40% OFF CASTLEIQ SERVICES</p>
    <video id="film" controls playsinline preload="metadata"></video>
    <script src="film.js"></script>
    <p>Make your pricing work harder.</p>
    <a class="cta" href="https://castleiq.com">Claim your offer at CastleIQ.com</a>
  </main>
</body>
</html>
